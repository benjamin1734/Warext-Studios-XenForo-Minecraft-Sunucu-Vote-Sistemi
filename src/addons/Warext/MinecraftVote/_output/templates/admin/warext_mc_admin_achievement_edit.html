<xf:title>{{ phrase('warext_mc_dyn_edit_achievement', {'title': $achievement.display_title}) }}</xf:title>

<xf:form action="{{ link('warext-minecraft/achievement-edit', $achievement) }}" class="block" ajax="true">
    <div class="block-container">
        <div class="block-body">
            <xf:formrow label="{{ phrase('warext_mc_i18n_0099') }}"><code>{$achievement.achievement_key}</code></xf:formrow>
            <xf:textboxrow name="title" value="{$achievement.title}" label="{{ phrase('warext_mc_i18n_0086') }}" maxlength="100" required="required" />
            <xf:textboxrow name="description" value="{$achievement.description}" label="{{ phrase('warext_mc_i18n_0010') }}" maxlength="255" />
            <xf:textboxrow name="icon" value="{$achievement.icon}" label="{{ phrase('warext_mc_i18n_0100') }}" maxlength="50" />
            <xf:selectrow name="metric" value="{$achievement.metric}" label="{{ phrase('warext_mc_i18n_0101') }}">
                <xf:foreach loop="$metrics" key="$metric" value="$metricTitle">
                    <xf:option value="{$metric}">{$metricTitle}</xf:option>
                </xf:foreach>
            </xf:selectrow>
            <xf:numberboxrow name="threshold" value="{$achievement.threshold}" min="0" label="{{ phrase('warext_mc_i18n_0102') }}" />
            <xf:numberboxrow name="display_order" value="{$achievement.display_order}" min="0" label="{{ phrase('warext_mc_i18n_0103') }}" />
            <xf:checkboxrow><xf:option name="is_active" value="1" selected="$achievement.is_active">{{ phrase('warext_mc_i18n_0235') }}</xf:option></xf:checkboxrow>
        </div>
        <xf:submitrow submit="{{ phrase('warext_mc_i18n_0021') }}" />
    </div>
</xf:form>
