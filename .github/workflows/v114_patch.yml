name: Apply v1.1.4 patch

on:
  push:
    branches:
      - fix-v1.1.4-vote-row-flex
    paths:
      - '.github/workflows/v114_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v1.1.4-vote-row-flex
      - name: Apply helper
        run: python3 .github/v114_patch.py
      - name: Validate
        run: |
          find src/addons/Warext/MinecraftVote -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 .github/security_regression.py
          python3 .github/validate_xf_source.py src/addons/Warext/MinecraftVote
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/security_regression.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update v1.1.4 regression guards"
          git push origin HEAD:fix-v1.1.4-vote-row-flex
