name: v1.0.4 Autofix

on:
  push:
    branches:
      - v1.0.4-install-upgrade-fix

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.4-install-upgrade-fix
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply v1.0.4 fixes
        run: python .github/v104_autofix.py
      - name: PHP syntax check
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.0.4 install and upgrade hardening"
          git push origin HEAD:v1.0.4-install-upgrade-fix
