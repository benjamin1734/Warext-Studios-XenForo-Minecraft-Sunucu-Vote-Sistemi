name: Build Add-on

on:
  push:
    branches:
      - main
    paths:
      - 'src/addons/Warext/MinecraftVote/**'
      - '.github/build_xf_data.py'
      - '.github/workflows/build-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build XenForo release data
        run: python3 .github/build_xf_data.py src/addons/Warext/MinecraftVote

      - name: Validate XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('src/addons/Warext/MinecraftVote/_data').glob('*.xml'))
          if not files:
              raise SystemExit('No _data XML files generated')
          for file in files:
              ET.parse(file)
              print(file)
          PY

      - name: Build direct-install ZIP
        id: package
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('src/addons/Warext/MinecraftVote/addon.json', encoding='utf-8') as f:
              data=json.load(f)
          print(data['version_string'].replace(' ', '-'))
          PY
          )
          VERSION_NUMBER=$(python3 - <<'PY'
          import json
          with open('src/addons/Warext/MinecraftVote/addon.json', encoding='utf-8') as f:
              data=json.load(f)
          print(data['version_string'].split()[0])
          PY
          )
          rm -rf build
          mkdir -p build/upload/src/addons/Warext build/releases
          cp -R src/addons/Warext/MinecraftVote build/upload/src/addons/Warext/MinecraftVote
          rm -rf build/upload/src/addons/Warext/MinecraftVote/_output
          cp README.md build/README.md
          FILE="build/releases/Warext-MinecraftVote-${VERSION}.zip"
          (cd build && zip -qr "releases/Warext-MinecraftVote-${VERSION}.zip" upload README.md)
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          for OLD_TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$OLD_TAG" != "$TAG" ]; then
              gh release delete "$OLD_TAG" --cleanup-tag -y || true
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            gh release create "$TAG" "$FILE" --title "$TAG" --notes "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Warext-MinecraftVote
          path: ${{ steps.package.outputs.file }}
