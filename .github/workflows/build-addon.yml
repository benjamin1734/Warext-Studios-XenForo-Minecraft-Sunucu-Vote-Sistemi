name: Build Add-on

on:
  push:
    branches:
      - main
    paths:
      - 'src/addons/Warext/MinecraftVote/**'
      - 'companion/WarextVerify/**'
      - '.github/build_xf_data.py'
      - '.github/build_xf_permissions.py'
      - '.github/validate_xf_source.py'
      - '.github/workflows/build-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XenForo source links
        run: python3 .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build XenForo release data
        run: |
          python3 .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_permissions.py src/addons/Warext/MinecraftVote

      - name: Validate XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('src/addons/Warext/MinecraftVote/_data').glob('*.xml'))
          if not files:
              raise SystemExit('No _data XML files generated')
          names = {file.name for file in files}
          required = {'permissions.xml', 'permission_interface_groups.xml'}
          missing = required - names
          if missing:
              raise SystemExit('Missing permission master data: ' + ', '.join(sorted(missing)))
          for file in files:
              ET.parse(file)
              print(file)
          PY

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WarextVerify
        run: mvn -B -q -f companion/WarextVerify/pom.xml package

      - name: Build release files
        id: package
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('src/addons/Warext/MinecraftVote/addon.json', encoding='utf-8') as f:
              data=json.load(f)
          print(data['version_string'].replace(' ', '-'))
          PY
          )
          VERSION_NUMBER=$(python3 - <<'PY'
          import json
          with open('src/addons/Warext/MinecraftVote/addon.json', encoding='utf-8') as f:
              data=json.load(f)
          print(data['version_string'].split()[0])
          PY
          )
          rm -rf build
          mkdir -p build/upload/src/addons/Warext build/releases
          cp -R src/addons/Warext/MinecraftVote build/upload/src/addons/Warext/MinecraftVote
          rm -rf build/upload/src/addons/Warext/MinecraftVote/_output
          cp README.md build/README.md
          XF_FILE="build/releases/Warext-MinecraftVote-${VERSION}.zip"
          MC_FILE="build/releases/WarextVerify-${VERSION_NUMBER}.jar"
          (cd build && zip -qr "releases/Warext-MinecraftVote-${VERSION}.zip" upload README.md)
          cp "companion/WarextVerify/target/WarextVerify-${VERSION_NUMBER}.jar" "$MC_FILE"
          echo "xf_file=${XF_FILE}" >> "$GITHUB_OUTPUT"
          echo "mc_file=${MC_FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          XF_FILE: ${{ steps.package.outputs.xf_file }}
          MC_FILE: ${{ steps.package.outputs.mc_file }}
        run: |
          for OLD_TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$OLD_TAG" != "$TAG" ]; then
              gh release delete "$OLD_TAG" --cleanup-tag -y || true
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XF_FILE" "$MC_FILE" --clobber
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            gh release create "$TAG" "$XF_FILE" "$MC_FILE" --title "$TAG" --notes "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Warext-MinecraftVote
          path: |
            ${{ steps.package.outputs.xf_file }}
            ${{ steps.package.outputs.mc_file }}
