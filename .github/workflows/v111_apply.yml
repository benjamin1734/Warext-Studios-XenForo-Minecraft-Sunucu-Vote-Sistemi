name: Apply v1.1.1 Integration

on:
  push:
    branches:
      - v1.1.1-media-thread-moderation
    paths:
      - '.github/workflows/v111_apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1-media-thread-moderation

      - name: Harden setup and regression rules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          setup = Path('src/addons/Warext/MinecraftVote/Setup.php')
          text = setup.read_text(encoding='utf-8')
          old = "$db->delete('xf_data_registry', 'data_key = ?', 'contentTypes');"
          new = "$this->app->repository('XF:ContentTypeField')->rebuildContentTypeCache();"
          if old not in text and new not in text:
              raise SystemExit('Setup content type cache pattern not found')
          text = text.replace(old, new)
          setup.write_text(text, encoding='utf-8')

          regression = Path('.github/security_regression.py')
          text = regression.read_text(encoding='utf-8')
          text = text.replace(
              "require('Service/Server/ThreadLinker.php', ['discussion_thread_id', 'threads/', 'boardUrl'])",
              "require('Service/Server/ThreadLinker.php', ['discussion_thread_id', 'threads/', 'boardUrl', 'getMappedCategory', 'canView'])"
          )
          text = text.replace(
              "require('ApprovalQueue/Server.php', ['XF\\\\ApprovalQueue\\\\AbstractHandler', 'actionApprove', 'actionDelete'])",
              "require('ApprovalQueue/Server.php', ['XF\\\\ApprovalQueue\\\\AbstractHandler', 'canViewContent', 'actionApprove', 'actionDelete'])"
          )
          text = text.replace(
              "require('Setup.php', ['installStep18', 'upgrade1011010Step1', 'ensureThreadMediaIntegration', 'warext_mc_server', 'contentTypes'])",
              "require('Setup.php', ['installStep18', 'upgrade1011010Step1', 'ensureThreadMediaIntegration', 'warext_mc_server', 'rebuildContentTypeCache'])"
          )
          if "require('Service/Server/Creator.php', ['trailer_url'])" not in text:
              marker = "require('Service/Server/Media.php', ['468', 'animated_banner', 'copyFileToAbstractedPath', 'IMAGETYPE_GIF'])"
              text = text.replace(marker, marker + "\nrequire('Service/Server/Creator.php', ['trailer_url'])")
          regression.write_text(text, encoding='utf-8')
          PY

      - name: PHP syntax
        run: find src/addons/Warext/MinecraftVote -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP comment check
        run: |
          php -r '
          $bad = false;
          $files = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("src/addons/Warext/MinecraftVote"));
          foreach ($files as $file) {
              if (!$file->isFile() || strtolower($file->getExtension()) !== "php") { continue; }
              foreach (token_get_all(file_get_contents($file->getPathname())) as $token) {
                  if (is_array($token) && ($token[0] === T_COMMENT || $token[0] === T_DOC_COMMENT)) {
                      fwrite(STDERR, $file->getPathname() . ":" . $token[2] . PHP_EOL);
                      $bad = true;
                  }
              }
          }
          exit($bad ? 1 : 0);'

      - name: JSON validation
        run: |
          find src/addons/Warext/MinecraftVote/_output -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Regression and source validation
        run: |
          python3 .github/security_regression.py
          python3 .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build release data
        run: |
          python3 .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_permissions.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_navigation.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_integrations.py src/addons/Warext/MinecraftVote

      - name: XML validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('src/addons/Warext/MinecraftVote/_data')
          required = {
              'routes.xml', 'templates.xml', 'content_type_fields.xml',
              'code_event_listeners.xml', 'template_modifications.xml', 'navigation.xml'
          }
          names = {p.name for p in root.glob('*.xml')}
          missing = required - names
          if missing:
              raise SystemExit('Missing: ' + ', '.join(sorted(missing)))
          for path in root.glob('*.xml'):
              ET.parse(path)
          PY

      - name: Commit hardening changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/addons/Warext/MinecraftVote/Setup.php .github/security_regression.py src/addons/Warext/MinecraftVote/_data
          git diff --cached --quiet && exit 0
          git commit -m "Harden v1.1.1 integration runtime"
          git push origin HEAD:v1.1.1-media-thread-moderation
