name: Apply v1.1.1 Integration

on:
  push:
    branches:
      - v1.1.1-media-thread-moderation
    paths:
      - '.github/v111_apply.py'
      - '.github/workflows/v111_apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1-media-thread-moderation

      - name: Apply patch
        run: python3 .github/v111_apply.py

      - name: Align regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/security_regression.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "require('_output/templates/public/warext_mc_server_add.html', ['kategori seçimi yeni form alanı açmaz', 'Ana sunucu adresi', 'Crossplay'])",
              "require('_output/templates/public/warext_mc_server_add.html', ['Sunucu tanıtım konusu', 'Görsel Kimlik', 'Ana sunucu adresi', 'Crossplay'])"
          )
          text = text.replace(
              "if version_string != '1.1.0' or int(addon.get('version_id', 0)) < 1011000:\n    raise SystemExit('Sürüm numarası 1.1.0 değil.')",
              "if version_string != '1.1.1' or int(addon.get('version_id', 0)) < 1011010:\n    raise SystemExit('Sürüm numarası 1.1.1 değil.')"
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: PHP syntax
        run: find src/addons/Warext/MinecraftVote -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JSON validation
        run: |
          find src/addons/Warext/MinecraftVote/_output -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Regression and source validation
        run: |
          python3 .github/security_regression.py
          python3 .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build release data
        run: |
          python3 .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_permissions.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_navigation.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_integrations.py src/addons/Warext/MinecraftVote

      - name: XML validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('src/addons/Warext/MinecraftVote/_data')
          required = {'routes.xml','templates.xml','content_type_fields.xml','code_event_listeners.xml','template_modifications.xml'}
          names = {p.name for p in root.glob('*.xml')}
          missing = required - names
          if missing:
              raise SystemExit('Missing: ' + ', '.join(sorted(missing)))
          for path in root.glob('*.xml'):
              ET.parse(path)
          PY

      - name: Commit applied patch
        run: |
          git checkout -- .github/workflows/php-lint.yml .github/workflows/build-addon.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v1.1.1 media thread moderation integration"
          git push origin HEAD:v1.1.1-media-thread-moderation
