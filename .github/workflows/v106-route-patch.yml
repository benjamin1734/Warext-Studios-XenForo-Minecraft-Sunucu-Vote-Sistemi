name: v1.0.6 Route Compatibility Patch

on:
  push:
    branches:
      - v1.0.6-admin-navigation
    paths:
      - .github/v106_route_patch.py
      - .github/workflows/v106-route-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.6-admin-navigation
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: python .github/v106_route_patch.py
      - run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python .github/security_regression.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix v1.0.6 admin root routing"
          git push
