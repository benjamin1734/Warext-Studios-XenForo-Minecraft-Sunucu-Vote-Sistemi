name: Apply v1.1.2 Content Type Fix

on:
  push:
    branches:
      - fix-v1.1.2-content-type
    paths:
      - '.github/workflows/v112_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v1.1.2-content-type

      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          setup = Path('src/addons/Warext/MinecraftVote/Setup.php')
          text = setup.read_text(encoding='utf-8')
          bad = """        $db->query(\n            'INSERT INTO xf_content_type (content_type, addon_id, fields) VALUES (?, ?, ?) '\n            . 'ON DUPLICATE KEY UPDATE addon_id = VALUES(addon_id)',\n            ['warext_mc_server', 'Warext/MinecraftVote', '']\n        );\n"""
          if bad not in text:
              raise SystemExit('Hatalı xf_content_type INSERT bloğu bulunamadı')
          text = text.replace(bad, '', 1)
          if re.search(r'\\bxf_content_type\\b', text):
              raise SystemExit('Setup.php içinde xf_content_type tablo referansı kaldı')
          setup.write_text(text, encoding='utf-8')

          addon_path = Path('src/addons/Warext/MinecraftVote/addon.json')
          addon = json.loads(addon_path.read_text(encoding='utf-8'))
          addon['version_id'] = 1011020
          addon['version_string'] = '1.1.2'
          addon_path.write_text(json.dumps(addon, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          regression = Path('.github/security_regression.py')
          r = regression.read_text(encoding='utf-8')
          r = r.replace(
              "if version_string != '1.1.1' or int(addon.get('version_id', 0)) < 1011010:\n    raise SystemExit('Sürüm numarası 1.1.1 değil.')",
              "if version_string != '1.1.2' or int(addon.get('version_id', 0)) < 1011020:\n    raise SystemExit('Sürüm numarası 1.1.2 değil.')"
          )
          marker = "server_admin = (ROOT / 'Admin/Controller/Server.php').read_text(encoding='utf-8')\n"
          guard = "setup_text = (ROOT / 'Setup.php').read_text(encoding='utf-8')\nif re.search(r'\\bxf_content_type\\b', setup_text):\n    raise SystemExit('Setup.php XenForo 2.3 üzerinde olmayan xf_content_type tablosunu kullanıyor')\n\n\n"
          if guard not in r:
              if marker not in r:
                  raise SystemExit('Regression guard marker bulunamadı')
              r = r.replace(marker, guard + marker, 1)
          regression.write_text(r, encoding='utf-8')

          readme = Path('README.md')
          rd = readme.read_text(encoding='utf-8')
          rd = rd.replace('Warext-MinecraftVote-1.1.1.zip', 'Warext-MinecraftVote-1.1.2.zip')
          rd = rd.replace('v1.1.1', 'v1.1.2')
          readme.write_text(rd, encoding='utf-8')
          PY

      - name: PHP syntax
        run: find src/addons/Warext/MinecraftVote -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP comment check
        run: |
          php -r '
          $bad = false;
          $files = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("src/addons/Warext/MinecraftVote"));
          foreach ($files as $file) {
              if (!$file->isFile() || strtolower($file->getExtension()) !== "php") { continue; }
              foreach (token_get_all(file_get_contents($file->getPathname())) as $token) {
                  if (is_array($token) && ($token[0] === T_COMMENT || $token[0] === T_DOC_COMMENT)) { $bad = true; }
              }
          }
          exit($bad ? 1 : 0);'

      - name: JSON validation
        run: |
          find src/addons/Warext/MinecraftVote/_output -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Regression and source validation
        run: |
          python3 .github/security_regression.py
          python3 .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build release data
        run: |
          python3 .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_permissions.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_navigation.py src/addons/Warext/MinecraftVote
          python3 .github/build_xf_integrations.py src/addons/Warext/MinecraftVote

      - name: XML validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('src/addons/Warext/MinecraftVote/_data')
          for path in root.glob('*.xml'):
              ET.parse(path)
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/addons/Warext/MinecraftVote/Setup.php src/addons/Warext/MinecraftVote/addon.json src/addons/Warext/MinecraftVote/_data .github/security_regression.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix XenForo content type upgrade for v1.1.2"
          git push origin HEAD:fix-v1.1.2-content-type
