name: Apply v1.1.8 vote page patch

on:
  push:
    branches:
      - v1.1.7-banner-standard
    paths:
      - '.github/workflows/v118_vote_page_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.7-banner-standard
      - name: Apply helper
        run: python3 .github/v118_vote_page_patch.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/addons/Warext/MinecraftVote/addon.json .github/security_regression.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "Start v1.1.8 vote page redesign"
          git push origin HEAD:v1.1.7-banner-standard
