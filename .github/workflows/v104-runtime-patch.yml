name: v1.0.4 Runtime Patch

on:
  push:
    branches:
      - v1.0.4-install-upgrade-fix

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.4-install-upgrade-fix
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: python .github/v104_runtime_patch.py
      - run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python .github/security_regression.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix v1.0.4 upgrade runtime constants"
          git push origin HEAD:v1.0.4-install-upgrade-fix
