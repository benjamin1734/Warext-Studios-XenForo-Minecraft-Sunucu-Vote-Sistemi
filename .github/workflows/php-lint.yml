name: PHP Lint and Regression

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP syntax check
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP comment check
        run: |
          php -r '
          $bad = false;
          $files = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("src/addons/Warext/MinecraftVote"));
          foreach ($files as $file) {
              if (!$file->isFile() || strtolower($file->getExtension()) !== "php") {
                  continue;
              }
              foreach (token_get_all(file_get_contents($file->getPathname())) as $token) {
                  if (is_array($token) && ($token[0] === T_COMMENT || $token[0] === T_DOC_COMMENT)) {
                      fwrite(STDERR, $file->getPathname() . ":" . $token[2] . PHP_EOL);
                      $bad = true;
                  }
              }
          }
          exit($bad ? 1 : 0);'

      - name: XenForo output JSON check
        run: |
          find src -type f -path '*/_output/*' -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done

      - name: Security regression checks
        run: python .github/security_regression.py

      - name: XenForo source validation
        run: python .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build XenForo release data
        run: |
          python .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python .github/build_xf_permissions.py src/addons/Warext/MinecraftVote

      - name: Validate generated XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('src/addons/Warext/MinecraftVote/_data')
          files = sorted(root.glob('*.xml'))
          required = {'permissions.xml', 'permission_interface_groups.xml'}
          names = {p.name for p in files}
          missing = required - names
          if missing:
              raise SystemExit('Eksik permission master data: ' + ', '.join(sorted(missing)))
          for path in files:
              ET.parse(path)
          print(f'{len(files)} XML dosyası parse edildi.')
          PY
