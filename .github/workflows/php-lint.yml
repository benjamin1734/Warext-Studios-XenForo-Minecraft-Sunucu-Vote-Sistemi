name: PHP Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP syntax check
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: XenForo output JSON check
        run: |
          find src -type f -path '*/_output/*' -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done

      - name: XenForo source validation
        run: python .github/validate_xf_source.py src/addons/Warext/MinecraftVote

      - name: Build XenForo release data
        run: |
          python .github/build_xf_data.py src/addons/Warext/MinecraftVote
          python .github/build_xf_permissions.py src/addons/Warext/MinecraftVote

      - name: Validate generated XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('src/addons/Warext/MinecraftVote/_data')
          files = sorted(root.glob('*.xml'))
          required = {'permissions.xml', 'permission_interface_groups.xml'}
          names = {p.name for p in files}
          missing = required - names
          if missing:
              raise SystemExit('Eksik permission master data: ' + ', '.join(sorted(missing)))
          for path in files:
              ET.parse(path)
          print(f'{len(files)} XML dosyası parse edildi.')
          PY
