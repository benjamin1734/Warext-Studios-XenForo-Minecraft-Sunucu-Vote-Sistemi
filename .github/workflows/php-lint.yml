name: PHP Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: PHP syntax check
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: XenForo output JSON check
        run: |
          find src -type f -path '*/_output/*' -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done
