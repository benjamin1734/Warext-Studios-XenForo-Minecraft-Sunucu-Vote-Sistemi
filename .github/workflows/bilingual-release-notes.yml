name: Bilingual Release Notes Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bilingual-release-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
# Warext Studios | XenForo Minecraft Sunucu & Vote Sistemi v1.1.9

1.1.9 sürümü sunucu detay sayfasını daha zengin ve XenForo ile doğal biçimde bütünleşen bir sunucu profiline dönüştürür.

- Hero ve banner tabanlı modern profil düzeni
- Sıralama ve hızlı erişim alanları
- Sunucu detaylarının daha okunabilir sunumu
- Son oy verenler ve top voter alanları
- Değerlendirmelerin profil sayfasında daha güçlü sunumu
- Mevcut oy, NuVotifier, analitik ve sunucu yönetim altyapısıyla uyumluluk

Kurulum paketini XenForo Admin CP > Add-ons > Install/upgrade from archive alanından doğrudan yükleyebilirsiniz.

---

## English

# Warext Studios | XenForo Minecraft Server & Vote System v1.1.9

Version 1.1.9 redesigns the server-detail page into a richer server profile that integrates naturally with XenForo.

- Modern hero- and banner-based profile layout
- Ranking and quick-access areas
- More readable presentation of server details
- Recent-voter and top-voter sections
- Stronger presentation of reviews on the server profile
- Compatibility with the existing voting, NuVotifier, analytics and server-management infrastructure

The installation package can be uploaded directly through XenForo Admin CP > Add-ons > Install/upgrade from archive.
EOF
          gh release edit 'v1.1.9' --notes-file /tmp/notes.md
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true
